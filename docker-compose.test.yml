services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: growlog_test
      POSTGRES_USER: growlog_test
      POSTGRES_PASSWORD: growlog_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growlog_test -d growlog_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

